name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  testes:
    name: testes (${{ matrix.so }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.so }}
    strategy:
      fail-fast: false
      matrix:
        so: [ubuntu-latest, windows-latest, macos-latest]
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: nucleo e medidas
        shell: bash
        run: node --test testes/*.test.js

  medidas:
    name: tabelas do README
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: a sequencia de Grundy
        run: node ferramentas/medidor.js sequencia
      - name: o periodo, medido
        run: node ferramentas/medidor.js periodo
      - name: que valores aparecem
        run: node ferramentas/medidor.js valores
      - name: a familia octal
        run: node ferramentas/medidor.js familia
      - name: o jogo direto conferindo
        run: node ferramentas/medidor.js juiz
      - name: as aberturas
        run: node ferramentas/medidor.js aberturas
